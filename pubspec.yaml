name: student_id
description: Student id capture project.
publish_to: 'none'

version: 2.0.0+11

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^3.0.0
  go_router: ^16.0.0
  dio: ^5.8.0
  camera: ^0.12.0
  image_picker: ^1.2.2
  shared_preferences: ^2.5.5
  equatable: ^2.0.8
  google_fonts: ^6.2.1
  dartz: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/ic_splash.png
    - assets/images/ic_alaram.png
    - assets/images/ic_hidnce.png
    - assets/images/user_profile.png
    - assets/images/student.png
    - assets/images/teacher.png
